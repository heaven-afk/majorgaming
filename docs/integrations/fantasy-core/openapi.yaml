        instructions: *a2
        updatedAt: *a14
      required:
        - status
        - endpoint
        - instructions
        - updatedAt
  securitySchemes:
    WebsiteIdentity:
      type: apiKey
      in: header
      name: X-Fantasy-Site
      description: Permanent website slug. Required for website data APIs; paired with
        a credential belonging to this website.
    PartnerRead:
      type: apiKey
      in: header
      name: x-fantasy-api-key
      description: Website API credential, registered per website and environment.
        Send X-Fantasy-Site. Server use only.
    MglService:
      type: apiKey
      in: header
      name: x-fantasy-service-key
      description: Website PROFILE credential for display-name sync only. Send
        X-Fantasy-Site.
    MglManager:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Website-signed RS256 or EdDSA; iss=the registered website issuer,
        aud=fantasy-core; required sub, displayName, iat, exp; 60s skew. JWKS or
        public PEM fallback. No passwords.
    PartnerAdmin:
      type: apiKey
      in: header
      name: x-fantasy-admin-key
      description: Partner-only operator credential; never issued to MGL.
    CronBearer:
      type: http
      scheme: bearer
      description: CRON_SECRET; not a manager token.
    HseSecret:
      type: apiKey
      in: header
      name: x-hse-api-key
      description: HSE service secret.
