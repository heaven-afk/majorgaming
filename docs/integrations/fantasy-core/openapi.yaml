components:
  schemas:
    Error:
      type: object
      properties:
        error: *a2
        details:
          nullable: true
          oneOf:
            - type: array
              items: *a2
            - type: object
              additionalProperties: true
      required:
        - error
    ActiveChip:
      type: string
      nullable: true
      enum:
        - null
        - triple_captain
        - bench_boost
      description: One chip per matchday; each type once per manager per tournament.
        Null selects none. Unknown strings return 400.
    Role:
      type: string
      enum:
        - Fragger
        - IGL
        - Support
        - Anchor
    StarterInput:
      type: object
      properties:
        playerId: *a2
        role:
          $ref: "#/components/schemas/Role"
        isCaptain: *a4
        isViceCaptain: *a4
      required:
        - playerId
        - role
    SubstituteInput:
      type: object
      properties:
        playerId: *a2
        role:
          type: string
          enum:
            - Fragger
            - IGL
            - Support
            - Anchor
            - bench
      required:
        - playerId
    SquadInput:
      type: object
      properties:
        captainPlayerId: *a2
        starters:
          type: array
          items:
            $ref: "#/components/schemas/StarterInput"
          minItems: 4
          maxItems: 4
        substitute:
          $ref: "#/components/schemas/SubstituteInput"
      required:
        - starters
        - substitute
    SquadSubmission:
      type: object
      properties:
        tournamentId: *a2
        matchdayNumber:
          type: integer
          minimum: 1
          default: 1
        activeChip:
          $ref: "#/components/schemas/ActiveChip"
        squad:
          $ref: "#/components/schemas/SquadInput"
      required:
        - tournamentId
        - squad
    Starter:
      type: object
      properties:
        playerId: *a2
        role:
          $ref: "#/components/schemas/Role"
        isCaptain: *a4
        isViceCaptain: *a4
        cost: *a13
      required:
        - playerId
        - role
        - isCaptain
        - isViceCaptain
        - cost
    Substitute:
      type: object
      properties:
        playerId: *a2
        role:
          $ref: "#/components/schemas/Role"
        cost: *a13
      required:
        - playerId
        - role
        - cost
    Squad:
      type: object
      properties:
        id: *a2
        managerId: *a2
        tournamentId: *a2
        matchdayNumber: *a1
        activeChip:
          $ref: "#/components/schemas/ActiveChip"
        totalCost: *a13
        captainPlayerId: *a2
        viceCaptainPlayerId: &a15
          type: string
          nullable: true
        starters:
          type: array
          items:
            $ref: "#/components/schemas/Starter"
        substitute:
          allOf:
            - $ref: "#/components/schemas/Substitute"
          nullable: true
        createdAt: &a14
          type: string
          format: date-time
          nullable: true
        updatedAt: *a14
      required:
        - id
        - managerId
        - tournamentId
        - matchdayNumber
        - activeChip
        - totalCost
        - captainPlayerId
        - viceCaptainPlayerId
        - starters
        - substitute
        - createdAt
        - updatedAt
    FreeTransferChip:
      type: object
