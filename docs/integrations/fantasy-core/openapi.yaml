  /api/v1/markets/{tournamentId}/window:
    post:
      operationId: manageWebsiteWindow
      tags:
        - MGL integration
      summary: manage Website Window
      description: Website administrator operation for assigned tournaments only.
        Requires website API server credential plus a token signed by that
        website issuer containing permissions [fantasy:windows:manage], with
        maximum 15-minute lifetime. Ordinary Manager tokens and platform
        dashboard login do not authorize this route. Open publishes frozen
        official prices; lock/close ends squad and transfer changes. Cannot
        reopen a played, expired or finalized matchday.
      security:
        - WebsiteIdentity: []
          PartnerRead: []
          ManagerBearer: []
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: *a2
      responses:
        "200":
          description: Success
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDiagnostic"
        "400":
          description: Invalid parameters or unknown chip
          headers: *a3
