openapi: 3.0.3
info:
  title: Heaven Fantasy Core — Website APIs
  version: 1.3.0
  description: "Heaven Stat Engine (also called Heaven Index) owns competitive
    data. MGL owns accounts and all user screens. Fantasy Core owns fantasy
    calculations and operations. Real deployment origins remain unprovisioned;
    use the same-origin server entry only until environments.json has verified
    URLs. Transfer Rules V1.0: each replacement costs 4 manager points; one
    single-player Free Transfer waiver per tournament. OPEN is required;
    tournament prices are immutable."
servers:
  - url: /
    description: Relative origin; use verified FANTASY_BASE_URL. Staging and
      production are not yet provisioned.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags:
        - MGL integration
      summary: get Health
      description: ""
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema: &a2
            type: string
          required: false
      responses:
        "200":
          description: Success
          headers: &a3
            X-RateLimit-Limit:
              description: Requests allowed in the current fixed 60-second window.
              schema: &a1
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining.
              schema: *a1
            X-RateLimit-Reset:
              description: UTC Unix seconds when the window resets.
              schema: *a1
            Cache-Control: &a10
              description: "Public reads: 5s for leaderboards, 15s otherwise.
                Private/diagnostic reads: private, max-age=0, must-revalidate.
                Mutations and errors: no-store."
              schema: *a2
            ETag: &a11
              description: Content hash of the complete selected representation. Send as
                If-None-Match for a 304.
              schema: *a2
            Retry-After: &a12
              description: Seconds before retrying a 429 response.
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "304":
          description: Representation unchanged; no response body. Still counts toward the
            request limit.
          headers: *a3
        "400":
          description: Invalid parameters or unknown chip
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required or invalid credential
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Resource not found or not yet finalized
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflict, closed submissions, name taken, or stale pagination cursor
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Squad role/validation rule failed
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Persistence or processing failure
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream HSE unavailable
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service not configured, rate limiter unavailable, or production
            closed
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
