  /api/v1/transfers:
    post:
      operationId: executeTransfer
      tags:
        - MGL integration
      summary: execute Transfer
      description: "Exactly one replacement per transaction, in an OPEN window only. A
        successful replacement costs 4 points or consumes the
        once-per-tournament Free Transfer chip. Required Idempotency-Key:
        retries return the original immutable receipt; changed payload under the
        same key returns 409. Server resolves prices from the fixed tournament
        snapshot. No raw finalized score is rewritten."
      security: &a8
        - PartnerRead: []
          MglManager: []
          WebsiteIdentity: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[A-Za-z0-9._:-]{8,128}$
      responses:
        "200":
